services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pavageau
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pavageau"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
    env_file:
      - .env
    environment:
      AWS_REGION: sa-east-1
      VAULT_PROVIDER: memory
      RADAR_BROWSER_HEADLESS: ${RADAR_BROWSER_HEADLESS_API:-0}
      RADAR_CHROME_USER_DATA_DIR: ${RADAR_CHROME_USER_DATA_DIR:-/tmp/pavageau-radar-profile}
      RADAR_CHROME_PROFILE_DIRECTORY: ${RADAR_CHROME_PROFILE_DIRECTORY:-Default}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  db_data:
